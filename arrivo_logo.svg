<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Arrivo! Logo</title>
  <desc>Logo Arrivo! con testo arancione su sfondo trasparente</desc>

  <!-- "Arriv" text -->
  <text x="0" y="158" font-family="Arial Black, Arial, sans-serif" font-size="130" font-weight="900" fill="#FF5722" letter-spacing="-2">Arriv</text>

  <!-- Circle (the "O") -->
  <circle cx="418" cy="100" r="72" fill="#FF5722"/>

  <!-- Clock hands inside circle - vertical (hour) and horizontal (minute) -->
  <line x1="418" y1="100" x2="418" y2="55" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <line x1="418" y1="100" x2="461" y2="100" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- "!" exclamation mark in amber -->
  <text x="510" y="158" font-family="Arial Black, Arial, sans-serif" font-size="130" font-weight="900" fill="#FF8F00">!</text>
</svg>
