name: 🌐 Deploy Web — arrivoapp.it

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy even if no frontend changes'
        required: false
        default: 'false'

concurrency:
  group: deploy-production-web
  cancel-in-progress: false   # mai interrompere un deploy in corso

env:
  HEALTH_URL: https://arrivoapp.it/api/health

jobs:
  # ─── 1. Lint + Type check (runner-side, veloce) ─────────────────────────────
  quality:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: ESLint
        run: npm run lint
        continue-on-error: false

      # Build Next.js avviene sul VPS tramite deploy.sh con DATABASE_URL reale.
      # In CI eseguiamo solo TS + lint — evita errori Prisma senza DB reale.

  # ─── 2. Deploy su VPS ───────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy VPS
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    environment:
      name: production
      url: https://arrivoapp.it

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy script on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash /root/arrivo/scripts/deploy.sh '${{ github.sha }}' '${{ github.actor }}'"

      - name: Post-deploy health check
        run: |
          sleep 5
          MAX=3; ATTEMPT=0
          until STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
            --max-time 15 "${{ env.HEALTH_URL }}" 2>/dev/null || echo "000"); \
            [ "$STATUS" = "200" ] || [ "$ATTEMPT" -ge "$MAX" ]; do
            echo "  Attempt $((ATTEMPT+1))/$MAX — HTTP $STATUS — retry in 10s..."
            sleep 10
            ATTEMPT=$((ATTEMPT+1))
          done
          echo "Final health check: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: ✅ Deploy summary
        if: always()
        run: |
          {
            echo "## 🚀 Web Deploy Summary"
            echo ""
            echo "| Campo | Valore |"
            echo "|-------|--------|"
            echo "| Status | ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Autore | ${{ github.actor }} |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| URL | [arrivoapp.it](https://arrivoapp.it) |"
            echo "| Ora | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
