name: 🤖 Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'arrivo-build/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'arrivo-build/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  APP_DIR: arrivo-build

jobs:
  build:
    name: 📦 Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      # ── Java ──────────────────────────────────────────────────────────────────
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # NO cache: 'gradle' here — android/ folder doesn't exist yet (generated by expo prebuild)
          # Gradle cache is handled by the explicit actions/cache step AFTER prebuild

      # ── npm install ───────────────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --legacy-peer-deps

      # ── TypeScript ────────────────────────────────────────────────────────────
      - name: TypeScript check
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

      # ── Android SDK ───────────────────────────────────────────────────────────
      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Accept all licenses
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Install SDK components required by Expo SDK 54
          "$SDKMANAGER" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platforms;android-35" \
            "platforms;android-36" \
            "ndk;27.1.12297006" \
            "platform-tools" 2>&1 | tail -5 || true
          # Report what's actually installed
          echo "Available platforms:"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "none"
          echo "Available build-tools:"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "none"

      # ── Expo prebuild ─────────────────────────────────────────────────────────
      - name: Expo prebuild
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_NO_GIT_STATUS: '1'   # salta check git status
        run: npx expo prebuild --platform android --clean

      # ── Patch build.gradle — bundle JS in ALL variants (no Metro) ───────────
      # expo prebuild --clean regenerates android/ from scratch, so this patch
      # must run AFTER prebuild. Sets debuggableVariants=[] so assembleRelease
      # (and assembleDebug) always embed index.android.bundle in the APK.
      - name: Patch build.gradle — standalone bundle
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          sed -i 's|// debuggableVariants = \["liteDebug", "prodDebug"\]|debuggableVariants = []   // standalone APK — JS bundled inside, no Metro|' app/build.gradle
          echo "✅ debuggableVariants patched:"
          grep -n 'debuggableVariants' app/build.gradle || echo "⚠ pattern not found — checking react block:"
          grep -n -A2 'react {' app/build.gradle | head -10

      # ── Patch compileSdk se android-36 non disponibile ───────────────────────
      - name: Patch compileSdk fallback
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            AVAIL=$(ls "$ANDROID_HOME/platforms/" | grep '^android-' | sort -t- -k2 -n | tail -1 | sed 's/android-//')
            echo "⚠ android-36 non disponibile — uso android-$AVAIL come compileSdk"
            cat gradle.properties
            echo "" >> gradle.properties
            echo "# CI fallback — android-36 non disponibile sul runner" >> gradle.properties
            echo "android.compileSdkVersion=$AVAIL" >> gradle.properties
          else
            echo "✅ android-36 disponibile"
          fi

      # ── local.properties ──────────────────────────────────────────────────────
      - name: Set Android SDK path
        working-directory: ${{ env.APP_DIR }}/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── Gradle cache ──────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('arrivo-build/android/**/*.gradle*', 'arrivo-build/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── Build STANDALONE APK (default) ───────────────────────────────────────
      # Uses assembleRelease so the JS bundle is ALWAYS included inside the APK.
      # The project's debug.keystore is used for signing — no extra secrets needed.
      # Result: installable on any Android device without Metro running.
      - name: Build STANDALONE APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            2>&1

      # ── Build RELEASE (firmato con keystore di produzione) ────────────────────
      - name: Decode keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        id: keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ${{ env.APP_DIR }}/android/app/release.keystore
            echo "present=true" >> $GITHUB_OUTPUT
            echo "✅ Keystore decodificato"
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "⚠ ANDROID_KEYSTORE_BASE64 non configurato — build non firmata"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build RELEASE APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ARGS=(
            assembleRelease
            --no-daemon
            --build-cache
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          )
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            ARGS+=(
              "-Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore"
              "-Pandroid.injected.signing.store.password=${{ secrets.ANDROID_STORE_PASSWORD }}"
              "-Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }}"
              "-Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}"
            )
          fi
          ./gradlew "${ARGS[@]}" 2>&1

      # ── Trova e rinomina APK ──────────────────────────────────────────────────
      - name: Locate APK
        id: apk
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          APK=$(find ${{ env.APP_DIR }}/android/app/build/outputs/apk \
            -name "*.apk" -not -name "*unsigned*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "❌ Nessun APK trovato"
            find ${{ env.APP_DIR }}/android/app/build/outputs -type f 2>/dev/null | head -20
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          DEST="ARRIVO-Admin-v1.0.0-${BUILD_TYPE}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> $GITHUB_OUTPUT
          echo "✅ APK: $DEST ($SIZE)"

      # ── Upload artifact ───────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARRIVO-Admin-${{ github.event.inputs.build_type || 'debug' }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Cleanup keystore
        if: always()
        run: rm -f ${{ env.APP_DIR }}/android/app/release.keystore 2>/dev/null || true

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: 📊 Build summary
        if: always()
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          STATUS="${{ job.status }}"
          {
            echo "## 🤖 Android Build — $BUILD_TYPE"
            echo ""
            echo "| Campo | Valore |"
            echo "|-------|--------|"
            echo "| Status | ${STATUS} |"
            echo "| APK | \`${{ steps.apk.outputs.path }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ora | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
