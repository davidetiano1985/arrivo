name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy — wait for it to finish

jobs:
  deploy:
    name: Deploy to arrivoapp.it
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Write SSH key ──────────────────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── 2. Run deploy script on VPS ───────────────────────────────────────────
      - name: Run deploy script on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash /root/arrivo/scripts/deploy.sh '${{ github.sha }}' '${{ github.actor }}'"

      # ── 3. Final health check from GitHub runner ──────────────────────────────
      - name: Final health check
        run: |
          sleep 3
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            https://arrivoapp.it/api/health 2>/dev/null || echo "000")
          echo "Health check: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠ Health check failed after deploy (HTTP $STATUS)"
            exit 1
          fi
          echo "✓ Site healthy"

      # ── 4. Summary ────────────────────────────────────────────────────────────
      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy Summary"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Author | ${{ github.actor }} |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Status | ${{ job.status }} |"
            echo "| Time   | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
