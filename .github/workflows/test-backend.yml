name: 🧪 Test Backend (FastAPI)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_call:   # consente a deploy-backend.yml di richiamare questo workflow

concurrency:
  group: test-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🐍 FastAPI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arrivo_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: arrivo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://arrivo_test:test_password@localhost:5432/arrivo_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx 2>/dev/null || true

      - name: Run migrations
        working-directory: backend
        run: |
          alembic upgrade head 2>/dev/null || echo "Nessuna migration da applicare"

      - name: Run tests
        working-directory: backend
        run: |
          if [ -d tests ] && [ -n "$(ls tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --tb=short 2>&1
          else
            echo "⚠ Nessun test trovato in backend/tests/ — verifica import base"
            python -c "from app.main import app; print('✅ App import OK')"
          fi

      - name: FastAPI startup check
        working-directory: backend
        run: |
          timeout 10 uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          SERVER_PID=$!
          sleep 4
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
            http://localhost:8001/api/v1/ 2>/dev/null || echo "000")
          echo "FastAPI health: HTTP $STATUS"
          kill $SERVER_PID 2>/dev/null || true
          # 200 o 404 (route non esiste) entrambi OK — solo 000/5xx è errore
          [[ "$STATUS" =~ ^(200|404|422)$ ]] || exit 1

      - name: 📊 Test summary
        if: always()
        run: |
          {
            echo "## 🧪 Backend Test Summary"
            echo ""
            echo "| Campo | Valore |"
            echo "|-------|--------|"
            echo "| Status | ${{ job.status == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Python | 3.12 |"
            echo "| DB | PostgreSQL 16 (test) |"
            echo "| Ora | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
